apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: war-apps-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      team: war-apps
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
